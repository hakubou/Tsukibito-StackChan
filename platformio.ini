; 平安俳句ｽﾀｯｸﾁｬﾝ（StackChan本体プロジェクトのステップ1から派生）
[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified
; ずんだもんの音声（tools/gen_voices.py で生成）をファームウェアに埋め込む
board_build.embed_files =
    assets/voices.bin
